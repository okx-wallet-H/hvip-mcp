name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
        continue-on-error: true

      - name: Lint (eslint)
        run: npm run lint
        continue-on-error: true

      - name: Build (esbuild)
        run: npm run build

      - name: 自检
        run: |
          node -e "
          const s = require('fs').readFileSync('./dist/index.js','utf8');

          const toolCount = (s.match(/server\.tool\(/g) || []).length;
          const tsIso = (s.match(/tsIso/g) || []).length;
          const cats = (s.match(/CAT:\[/g) || []).length;

          console.log('工具注册:', toolCount);
          console.log('tsIso 引用:', tsIso);
          console.log('CAT 标签:', cats);
          console.log('只读模式:', s.includes('OKX_READ_ONLY') ? 'PASS' : 'MISSING');
          console.log('风险分级:', s.includes('classifyRisk') ? 'PASS' : 'MISSING');
          console.log('shebang:', s.startsWith('#!/usr/bin/env node') ? 'PASS' : 'MISSING');
          console.log('指标模块:', s.includes('okx_indicator') ? 'PASS' : 'MISSING');
          console.log('SmartMoney:', s.includes('okx_smart_leaderboard') ? 'PASS' : 'MISSING');

          if (toolCount < 200) { console.log('FAIL: tool count', toolCount); process.exit(1); }
          if (cats < 20) { console.log('FAIL: CAT tags', cats); process.exit(1); }
          if (!s.includes('OKX_READ_ONLY')) { console.log('FAIL: missing OKX_READ_ONLY'); process.exit(1); }
          if (!s.includes('#!/usr/bin/env node')) { console.log('FAIL: missing shebang'); process.exit(1); }
          console.log('PASS: all checks');
          "
