<!doctype html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<title>hvip AI · 交易助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══ SVG Icon Library ═══ */
svg.icon{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-0.15em}
svg.icon.filled{fill:currentColor;stroke:none}
/* Colored icon states */
.ic-lock{color:hsl(var(--c-red))}
.ic-key{color:hsl(var(--c-amber))}
.ic-theme{color:hsl(var(--c-amber))}
.ic-send{color:hsl(var(--c-purple))}
.ic-menu{color:hsl(var(--c-blue))}
.ic-eye{color:hsl(var(--c-blue))}
.ic-trash{color:hsl(var(--c-red))}

/* ═══ Design Tokens ═══ */
:root{
  --background:0 0% 100%;--foreground:240 10% 3.9%;
  --card:0 0% 100%;--card-foreground:240 10% 3.9%;
  --primary:240 5.9% 10%;--primary-foreground:0 0% 98%;
  --secondary:240 4.8% 95.9%;--secondary-foreground:240 5.9% 10%;
  --muted:240 4.8% 95.9%;--muted-foreground:240 3.8% 46.1%;
  --accent:240 4.8% 95.9%;--accent-foreground:240 5.9% 10%;
  --destructive:0 84.2% 60.2%;--destructive-foreground:0 0% 98%;
  --border:240 5.9% 90%;--input:240 5.9% 90%;--ring:240 5.9% 10%;
  --radius:0.625rem;--radius-sm:0.375rem;--radius-lg:0.75rem;--radius-xl:1rem;
  --sidebar-bg:240 5.9% 98%;--sidebar-fg:240 5.3% 26.1%;
  --sidebar-border:240 5.9% 90%;--sidebar-accent:240 4.8% 95.9%;
  --icon:240 5% 36%;--icon-hover:240 5.9% 10%;
  --c-blue:221 83% 53%;--c-purple:262 83% 58%;--c-amber:38 92% 50%;
  --c-red:0 84% 60%;--c-green:142 76% 36%;--c-teal:173 80% 36%;
  --font-sans:'Inter',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono','Fira Code',monospace;
}
[data-theme="dark"]{
  --background:240 10% 3.9%;--foreground:0 0% 98%;
  --card:240 10% 5.9%;--card-foreground:0 0% 98%;
  --primary:0 0% 98%;--primary-foreground:240 5.9% 10%;
  --secondary:240 3.7% 15.9%;--secondary-foreground:0 0% 98%;
  --muted:240 3.7% 15.9%;--muted-foreground:240 5% 64.9%;
  --accent:240 3.7% 15.9%;--accent-foreground:0 0% 98%;
  --destructive:0 62.8% 40%;--destructive-foreground:0 0% 98%;
  --border:240 3.7% 18%;--input:240 3.7% 18%;--ring:240 4.9% 83.9%;
  --sidebar-bg:240 5.9% 6%;--sidebar-fg:240 4.8% 95.9%;
  --sidebar-border:240 3.7% 15.9%;--sidebar-accent:240 3.7% 15.9%;
  --icon:240 5% 70%;--icon-hover:0 0% 98%;
}
*{margin:0;padding:0;box-sizing:border-box}
html{height:100dvh;overflow:hidden;position:fixed;width:100%;top:0;left:0}
body{
  height:100dvh;overflow:hidden;position:relative;
  font-family:var(--font-sans);font-size:14px;line-height:1.6;
  color:hsl(var(--foreground));background:hsl(var(--background));
  display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  touch-action:manipulation;
}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
footer textarea{touch-action:manipulation}

/* ═══ Auth ═══ */
#auth-screen{display:flex;flex:1;align-items:center;justify-content:center;padding:24px;background:hsl(var(--background))}
#auth-screen .auth-card{
  width:100%;max-width:400px;background:hsl(var(--card));border-radius:var(--radius-xl);
  border:1px solid hsl(var(--border));box-shadow:0 1px 3px hsl(0 0% 0%/0.04),0 4px 16px hsl(0 0% 0%/0.04);
  padding:40px 32px;text-align:center;
}
.auth-card .logo{
  width:48px;height:48px;margin:0 auto 16px;
  background:hsl(var(--foreground));border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  color:hsl(var(--background));font-family:var(--font-sans);
}
.auth-card h2{font-size:18px;font-weight:700;color:hsl(var(--foreground));margin-bottom:4px;letter-spacing:-0.3px}
.auth-card .sub{font-size:13px;color:hsl(var(--muted-foreground));margin-bottom:24px;line-height:1.5}
.auth-card .field{margin-bottom:14px;text-align:left}
.auth-card .field label{display:block;font-size:12px;font-weight:600;color:hsl(var(--foreground));margin-bottom:5px}
.auth-card .field input{
  width:100%;padding:10px 14px;border-radius:var(--radius);
  border:1px solid hsl(var(--input));background:hsl(var(--background));
  color:hsl(var(--foreground));font-size:14px;font-family:inherit;outline:none;transition:all .2s;
}
.auth-card .field input:focus{border-color:hsl(var(--ring));box-shadow:0 0 0 3px hsl(var(--ring)/0.1)}
.auth-card .field .pw-wrap{position:relative}
.auth-card .field .pw-wrap input{padding-right:42px}
.auth-card .field .pw-wrap .toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;color:hsl(var(--icon));padding:4px;border-radius:4px;border:none;background:none;transition:color .15s}
.auth-card .field .pw-wrap .toggle:hover{color:hsl(var(--icon-hover))}
.auth-card .field .pw-wrap .toggle svg{width:18px;height:18px}
.auth-card .error{font-size:12px;color:hsl(var(--destructive));background:hsl(var(--destructive)/0.06);padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:16px;display:none}
.auth-card .error.show{display:block}
.auth-card button.primary{
  width:100%;padding:10px 16px;border-radius:var(--radius);border:none;
  background:hsl(var(--foreground));color:hsl(var(--background));
  font-size:14px;font-weight:600;transition:all .15s;font-family:inherit;
}
.auth-card button.primary:hover{opacity:.85}
.auth-card button.primary:disabled{opacity:.4;cursor:default}
.auth-card .switch{font-size:12px;color:hsl(var(--muted-foreground));margin-top:18px}
.auth-card .switch a{color:hsl(var(--foreground));cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* ═══ Key Screen ═══ */
#key-screen{display:none;flex:1;align-items:center;justify-content:center;padding:24px;background:hsl(var(--background))}
.key-card{
  width:100%;max-width:420px;background:hsl(var(--card));border-radius:var(--radius-xl);
  border:1px solid hsl(var(--border));box-shadow:0 1px 3px hsl(0 0% 0%/0.04),0 4px 16px hsl(0 0% 0%/0.04);
  padding:36px 28px;text-align:center;
}
.key-card .logo{width:48px;height:48px;margin:0 auto 14px;background:hsl(var(--foreground));border-radius:12px;display:flex;align-items:center;justify-content:center}
.key-card .logo svg{color:hsl(var(--background));width:22px;height:22px}
.key-card h2{font-size:18px;font-weight:700;margin-bottom:4px}
.key-card .sub{font-size:12px;color:hsl(var(--muted-foreground));margin-bottom:20px;line-height:1.5}
.key-card .sub a{color:hsl(var(--foreground));font-weight:600}
.key-card .field{margin-bottom:10px;text-align:left}
.key-card .field label{display:block;font-size:11.5px;font-weight:600;margin-bottom:4px}
.key-card .field input{width:100%;padding:9px 12px;border-radius:var(--radius-sm);border:1px solid hsl(var(--input));background:hsl(var(--background));color:hsl(var(--foreground));font-size:13px;font-family:var(--font-mono);outline:none;transition:all .2s}
.key-card .field input:focus{border-color:hsl(var(--ring));box-shadow:0 0 0 3px hsl(var(--ring)/0.1)}
.key-card .ok{font-size:12px;color:#16a34a;margin-bottom:14px;display:none;font-weight:500}
.key-card .ok.show{display:block}
.key-card .btn-row{display:flex;gap:8px}
.key-card .btn-row button{flex:1;padding:10px 16px;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.key-card .btn-row button.primary{border:none;background:hsl(var(--foreground));color:hsl(var(--background))}
.key-card .btn-row button.primary:hover{opacity:.85}
.key-card .btn-row button.primary:disabled{opacity:.4;cursor:default}
.key-card .btn-row button.secondary{border:1px solid hsl(var(--border));background:transparent;color:hsl(var(--foreground))}
.key-card .btn-row button.secondary:hover{background:hsl(var(--foreground)/0.04)}
.key-card .btn-row button.secondary:disabled{opacity:.4;cursor:default}

/* ═══ Chat ═══ */
#chat-screen{display:none;flex:1;flex-direction:column;overflow:hidden;background:hsl(var(--background));min-height:0}
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;background:hsl(var(--card));border-bottom:1px solid hsl(var(--border));
  z-index:10;min-height:48px;flex-shrink:0;
}
header .profile{display:flex;align-items:center;gap:8px}
header .profile .menu-btn{
  background:none;border:none;cursor:pointer;padding:6px;border-radius:var(--radius-sm);
  color:hsl(var(--icon));transition:all .15s;display:flex;
}
header .profile .menu-btn:hover{background:hsl(var(--accent));color:hsl(var(--icon-hover))}
header .profile .menu-btn svg{width:18px;height:18px}
header .profile .avatar{
  width:28px;height:28px;border-radius:8px;background:hsl(var(--foreground));
  display:flex;align-items:center;justify-content:center;
  color:hsl(var(--background));font-size:12px;font-weight:700;flex-shrink:0;
}
header .profile .name{font-size:13px;font-weight:600;color:hsl(var(--foreground))}
header .profile .key-badge{font-size:9px;padding:1px 8px;border-radius:10px;border:1px solid hsl(142 76% 36%/0.3);color:hsl(142 76% 36%);background:hsl(142 76% 36%/0.06);margin-left:4px;display:none;font-weight:500}
header .profile .key-badge.inline{display:inline}
header .actions{display:flex;gap:4px;align-items:center}
header .actions button{
  background:none;border:none;cursor:pointer;padding:6px;border-radius:var(--radius-sm);
  color:hsl(var(--icon));transition:all .15s;display:flex;
}
header .actions button:hover{background:hsl(var(--accent));color:hsl(var(--icon-hover))}
header .actions button.danger:hover{color:hsl(var(--destructive));background:hsl(var(--destructive)/0.06)}
header .actions button svg{width:17px;height:17px}

/* ═══ Messages ═══ */
main#msg-list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;min-height:0}
.msg{max-width:88%;animation:msgIn .25s ease;word-break:break-word}
.msg.user{align-self:flex-end}
.msg.ai{align-self:flex-start}

/* User message */
.msg.user .bubble{
  background:hsl(var(--foreground));color:hsl(var(--background));
  padding:10px 16px;border-radius:var(--radius-lg);border-bottom-right-radius:4px;
  font-size:14px;line-height:1.5;
}

/* AI message */
.msg.ai .ai-wrapper{display:flex;gap:0;align-items:flex-start}
.msg.ai .ai-content{flex:1;min-width:0}
.msg.ai .sender{font-size:11px;font-weight:600;color:hsl(var(--muted-foreground));margin-bottom:4px}
.msg.ai .body{
  background:hsl(var(--card));border:1px solid hsl(var(--border));
  padding:14px 18px;border-radius:var(--radius);border-top-left-radius:4px;
  font-size:14px;line-height:1.7;color:hsl(var(--card-foreground));
  box-shadow:0 1px 2px hsl(0 0% 0%/0.02);
}

/* ═══ Markdown Typography ═══ */
.msg.ai .body h1{font-size:18px;font-weight:700;color:hsl(var(--foreground));margin:16px 0 8px;letter-spacing:-0.3px;line-height:1.3}
.msg.ai .body h2{font-size:16px;font-weight:700;color:hsl(var(--foreground));margin:14px 0 6px;letter-spacing:-0.2px;line-height:1.3}
.msg.ai .body h3{font-size:14px;font-weight:600;color:hsl(var(--foreground));margin:12px 0 4px;line-height:1.3}
.msg.ai .body p{margin:6px 0;line-height:1.7}
.msg.ai .body p:first-child{margin-top:0}
.msg.ai .body strong{color:hsl(var(--foreground));font-weight:600}
.msg.ai .body em{font-style:italic;color:hsl(var(--muted-foreground))}
.msg.ai .body ul,.msg.ai .body ol{margin:8px 0;padding-left:22px}
.msg.ai .body li{margin:4px 0;line-height:1.6}
.msg.ai .body li::marker{color:hsl(var(--muted-foreground))}
.msg.ai .body a{color:hsl(var(--foreground));text-decoration:underline;text-underline-offset:3px;font-weight:500}
.msg.ai .body blockquote{
  border-left:2px solid hsl(var(--foreground));margin:10px 0;padding:4px 14px;
  color:hsl(var(--muted-foreground));background:hsl(var(--foreground)/0.03);
  border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-style:italic;
}
.msg.ai .body pre{
  background:hsl(var(--foreground));color:hsl(var(--background));
  padding:14px 16px;border-radius:var(--radius);overflow-x:auto;margin:10px 0;
  font-size:12.5px;line-height:1.55;
}
.msg.ai .body code{
  font-family:var(--font-mono);font-size:12px;background:hsl(var(--secondary));
  padding:2px 6px;border-radius:4px;color:hsl(var(--foreground));
}
.msg.ai .body pre code{background:none;padding:0;color:inherit;font-size:12.5px}
.msg.ai .body table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12px}
.msg.ai .body th,.msg.ai .body td{border:1px solid hsl(var(--border));padding:6px 12px;text-align:left}
.msg.ai .body th{background:hsl(var(--secondary));font-weight:600;color:hsl(var(--foreground))}
.msg.ai .body hr{border:none;border-top:1px solid hsl(var(--border));margin:12px 0}
.msg.ai .body .token-meta{
  font-size:10.5px;color:hsl(var(--muted-foreground));margin-top:10px;
  border-top:1px solid hsl(var(--border));padding-top:8px;display:flex;gap:14px;
}

/* Streaming cursor */
.msg .cursor{display:inline-block;width:6px;height:16px;background:hsl(var(--foreground));vertical-align:middle;margin-left:2px;border-radius:1px;animation:blink .8s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* ═══ Tool Cards ═══ */
.tool-cards{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.tool-card{
  font-size:11px;padding:8px 12px;border-radius:var(--radius-sm);
  border-left:2px solid hsl(var(--foreground));background:hsl(var(--secondary));
  transition:all .2s;
}
.tool-card.done{border-left-color:hsl(142 76% 36%);background:hsl(142 76% 36%/0.04)}
.tool-card.error{border-left-color:hsl(var(--destructive));background:hsl(var(--destructive)/0.04)}
.tool-card .tc-header{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.tool-card .tc-header .tc-icon{display:flex}
.tool-card .tc-header .tc-icon svg{width:12px;height:12px}
.tool-card .tc-header .tc-name{font-family:var(--font-mono);font-weight:600;color:hsl(var(--foreground));font-size:10.5px}
.tool-card .tc-header .tc-time{font-size:9px;color:hsl(var(--muted-foreground));margin-left:auto}
.tool-card .tc-input{font-size:10px;color:hsl(var(--muted-foreground));margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool-card .tc-result{font-size:10.5px;color:hsl(var(--foreground));max-height:55px;overflow:hidden;line-height:1.4}
.tool-card .tc-error{font-size:10.5px;color:hsl(var(--destructive))}
.tool-card .spinner{display:inline-block;width:10px;height:10px;border:2px solid hsl(var(--border));border-top-color:hsl(var(--foreground));border-radius:50%;animation:spin .6s linear infinite}

/* ═══ Welcome ═══ */
.welcome{text-align:center;color:hsl(var(--muted-foreground));margin-top:48px;animation:msgIn .4s ease}
.welcome .w-logo{width:56px;height:56px;margin:0 auto 18px;background:hsl(var(--foreground));border-radius:16px;display:flex;align-items:center;justify-content:center;color:hsl(var(--background));font-family:var(--font-sans)}
.welcome h2{font-size:22px;margin-bottom:6px;color:hsl(var(--foreground));font-weight:700;letter-spacing:-0.4px}
.welcome p{font-size:13.5px;margin-bottom:4px}
.welcome .hints{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:24px;max-width:500px;margin-left:auto;margin-right:auto}
.welcome .hints button{
  font-size:12.5px;padding:7px 16px;border-radius:20px;
  border:1px solid hsl(var(--border));background:hsl(var(--card));
  color:hsl(var(--foreground));transition:all .15s;font-family:inherit;
}
.welcome .hints button:hover{border-color:hsl(var(--foreground));background:hsl(var(--foreground)/0.04);transform:translateY(-1px)}

/* ═══ Input ═══ */
footer{padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:hsl(var(--card));border-top:1px solid hsl(var(--border));display:flex;gap:8px;align-items:flex-end;z-index:10;flex-shrink:0}
footer .input-wrap{flex:1;position:relative}
footer textarea{
  width:100%;padding:10px 14px;border-radius:var(--radius);border:1px solid hsl(var(--input));
  background:hsl(var(--background));color:hsl(var(--foreground));font-size:14px;
  resize:none;outline:none;line-height:1.5;max-height:120px;font-family:inherit;
  transition:border-color .2s;
}
footer textarea:focus{border-color:hsl(var(--ring));box-shadow:0 0 0 3px hsl(var(--ring)/0.08)}
footer textarea::placeholder{color:hsl(var(--muted-foreground)/0.45)}
footer .status{font-size:10px;color:hsl(var(--muted-foreground));margin-top:4px;text-align:right}
footer button.send-btn{
  width:38px;height:38px;border-radius:var(--radius);border:none;
  background:hsl(var(--foreground));color:hsl(var(--background));
  font-size:16px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
footer button.send-btn svg{width:16px;height:16px}
footer button.send-btn:hover{opacity:.85}
footer button.send-btn:active{transform:scale(.95)}
footer button.send-btn:disabled{opacity:.3;cursor:default;transform:none}

/* ═══ Sidebar ═══ */
#history-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:hsl(0 0% 0%/0.2);z-index:20;animation:fadeIn .2s}
#history-panel{
  position:fixed;top:0;left:0;bottom:0;width:280px;background:hsl(var(--sidebar-bg));
  border-right:1px solid hsl(var(--sidebar-border));z-index:21;
  display:flex;flex-direction:column;transform:translateX(-100%);
  transition:transform .25s cubic-bezier(.4,0,.2,1);
}
#history-panel.open{transform:translateX(0)}
#history-panel .h-head{padding:14px 16px;border-bottom:1px solid hsl(var(--sidebar-border));display:flex;align-items:center;justify-content:space-between}
#history-panel .h-head h3{font-size:14px;font-weight:700;color:hsl(var(--sidebar-fg))}
#history-panel .h-head button{background:none;border:none;cursor:pointer;padding:4px;border-radius:4px;color:hsl(var(--muted-foreground));display:flex;transition:all .15s}
#history-panel .h-head button:hover{background:hsl(var(--sidebar-accent));color:hsl(var(--icon-hover))}
#history-panel .h-head button svg{width:16px;height:16px}
#history-panel .h-list{flex:1;overflow-y:auto;padding:8px}
#history-panel .h-item{padding:10px 14px;border-radius:var(--radius-sm);cursor:pointer;margin-bottom:2px;transition:all .15s;display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:hsl(var(--sidebar-fg))}
#history-panel .h-item:hover{background:hsl(var(--sidebar-accent))}
#history-panel .h-item.active{background:hsl(var(--foreground));color:hsl(var(--background))}
#history-panel .h-item .h-title{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
#history-panel .h-item .h-time{font-size:9.5px;color:hsl(var(--muted-foreground));margin-left:8px;flex-shrink:0}
#history-panel .h-item.active .h-time{opacity:.6}
#history-panel .h-item .h-del{opacity:0;transition:opacity .15s;background:none;border:none;cursor:pointer;padding:2px 4px;border-radius:4px;color:hsl(var(--muted-foreground));display:flex}
#history-panel .h-item:hover .h-del{opacity:1}
#history-panel .h-item .h-del:hover{color:hsl(var(--destructive))}
#history-panel .h-item .h-del svg{width:13px;height:13px}
#history-panel .h-new{margin:8px;padding:9px;border-radius:var(--radius);border:1.5px dashed hsl(var(--border));text-align:center;font-size:12.5px;color:hsl(var(--foreground));cursor:pointer;transition:all .15s;font-weight:500}
#history-panel .h-new:hover{background:hsl(var(--foreground)/0.04);border-color:hsl(var(--foreground))}

/* Animations & Scrollbar */
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:5px}

<script>
// ═══ Markdown Renderer ═══
function renderMarkdown(text) {
  if (!text) return ''
  var out = '', lines = text.split('\n')
  var inCode = false, codeBuf = '', codeLang = ''
  var inTable = false, tableRows = []

  function flushInline(t) {
    t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    t = t.replace(/__(.+?)__/g, '<strong>$1</strong>')
    t = t.replace(/\*(.+?)\*/g, '<em>$1</em>')
    t = t.replace(/_(.+?)_/g, '<em>$1</em>')
    t = t.replace(/`([^`]+)`/g, '<code>$1</code>')
    t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
    t = t.replace(/~~(.+?)~~/g, '<s>$1</s>')
    return t
  }

  function flushTable() {
    if (!inTable || tableRows.length === 0) return ''
    var html = '<table>'
    if (tableRows.length > 0) {
      html += '<thead><tr>'
      for (var i = 0; i < tableRows[0].length; i++) html += '<th>' + flushInline(tableRows[0][i]) + '</th>'
      html += '</tr></thead>'
    }
    if (tableRows.length > 1) {
      html += '<tbody>'
      for (var r = 1; r < tableRows.length; r++) {
        html += '<tr>'
        for (var c = 0; c < tableRows[r].length; c++) html += '<td>' + flushInline(tableRows[r][c]) + '</td>'
        html += '</tr>'
      }
      html += '</tbody>'
    }
    html += '</table>'; inTable = false; tableRows = []
    return html
  }

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i], trimmed = line.trim()
    if (trimmed.startsWith('```')) {
      if (inCode) {
        out += '<pre><code>' + escHtml(codeBuf.trimEnd()) + '</code></pre>'
        codeBuf = ''; codeLang = ''; inCode = false
      } else {
        if (inTable) out += flushTable()
        codeLang = trimmed.slice(3).trim(); inCode = true
      }
      continue
    }
    if (inCode) { codeBuf += line + '\n'; continue }
    if (trimmed.startsWith('|') && trimmed.endsWith('|')) {
      if (trimmed.match(/^\|[\s:|-]+\|$/)) continue
      if (!inTable) { inTable = true }
      tableRows.push(trimmed.split('|').filter(function(c){return c.trim()}).map(function(c){return c.trim()}))
      continue
    } else if (inTable) { out += flushTable() }
    var m = trimmed.match(/^(#{1,3})\s+(.+)/)
    if (m) { out += '<h' + m[1].length + '>' + flushInline(m[2]) + '</h' + m[1].length + '>'; continue }
    if (trimmed.startsWith('> ')) { out += '<blockquote>' + flushInline(trimmed.slice(2)) + '</blockquote>'; continue }
    if (trimmed.match(/^(-{3,}|\*{3,})$/)) { out += '<hr>'; continue }
    if (trimmed.match(/^[-*+]\s/)) { out += '<ul><li>' + flushInline(trimmed.replace(/^[-*+]\s+/, '')) + '</li></ul>'; continue }
    if (trimmed.match(/^\d+\.\s/)) { out += '<ol><li>' + flushInline(trimmed.replace(/^\d+\.\s+/, '')) + '</li></ol>'; continue }
    if (!trimmed) { out += '<br>'; continue }
    out += '<p>' + flushInline(trimmed) + '</p>'
  }
  if (inCode) out += '<pre><code>' + escHtml(codeBuf.trimEnd()) + '</code></pre>'
  if (inTable) out += flushTable()
  return out
}

function escHtml(s) {
  if (!s) return ''
  var d = document.createElement('div')
  d.textContent = typeof s === 'string' ? s : JSON.stringify(s)
  return d.innerHTML
}

// ═══ State ═══
var state = {
  token: null, username: null, hasKeys: false, keyHint: null,
  authMode: 'unlock', messages: [], streaming: false, abortController: null,
  currentConvId: null
};
var $ = function(id) { return document.getElementById(id) };

// ═══ Theme ═══
(function(){
  var s = localStorage.getItem('chat-theme');
  if (s) document.documentElement.setAttribute('data-theme', s);
})();

function toggleTheme() {
  var d = document.documentElement;
  var is = d.getAttribute('data-theme') === 'dark';
  var next = is ? 'light' : 'dark';
  d.setAttribute('data-theme', next);
  localStorage.setItem('chat-theme', next);
  // Swap sun/moon icon
  var sun = document.getElementById('theme-sun');
  if (sun) sun.innerHTML = '<use href="' + (next === 'dark' ? '#i-sun' : '#i-moon') + '"/>';
}

// ═══ Auth ═══
var pinVisible = false;
document.getElementById('pin-toggle').addEventListener('click', function(){
  pinVisible = !pinVisible;
  document.getElementById('auth-pin').type = pinVisible ? 'text' : 'password';
  this.innerHTML = '<svg><use href="' + (pinVisible ? '#i-eye-off' : '#i-eye') + '"/></svg>';
});

function toggleAuthMode() {
  state.authMode = state.authMode === 'unlock' ? 'register' : 'unlock';
  if (state.authMode === 'register') {
    $('auth-title').textContent = '创建账户';
    $('auth-btn').textContent = '创建并解锁';
    $('switch-link').textContent = '已有账户？去解锁';
  } else {
    $('auth-title').textContent = '解锁账户';
    $('auth-btn').textContent = '解锁';
    $('switch-link').textContent = '没有账户？去注册';
  }
  $('auth-error').classList.remove('show');
}

async function handleAuth() {
  var username = $('auth-username').value.trim();
  var pin = $('auth-pin').value;
  var errEl = $('auth-error');
  if (!username || username.length < 3) { errEl.textContent = '用户名至少 3 个字符'; errEl.classList.add('show'); return; }
  if (!pin || pin.length < 4) { errEl.textContent = 'PIN 至少 4 位'; errEl.classList.add('show'); return; }
  $('auth-btn').disabled = true;
  errEl.classList.remove('show');
  try {
    if (state.authMode === 'register') {
      var r1 = await fetch('/api/v2/auth/register', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:username,pin:pin}) });
      var d1 = await r1.json();
      if (!d1.ok) { errEl.textContent = d1.error || '注册失败'; errEl.classList.add('show'); $('auth-btn').disabled = false; return; }
    }
    var r2 = await fetch('/api/v2/auth/unlock', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:username,pin:pin}) });
    var d2 = await r2.json();
    if (!d2.ok) { errEl.textContent = d2.error || '解锁失败'; errEl.classList.add('show'); $('auth-btn').disabled = false; return; }
    state.token = d2.sessionToken; state.username = d2.username; state.hasKeys = d2.hasKeys; state.keyHint = d2.keyHint;
    if (!d2.hasKeys) { showKeyBinding(); } else { showChat(); }
  } catch(e) { errEl.textContent = '网络错误'; errEl.classList.add('show'); }
  $('auth-btn').disabled = false;
}

$('auth-username').addEventListener('keydown', function(e){ if(e.key==='Enter') $('auth-pin').focus(); });
$('auth-pin').addEventListener('keydown', function(e){ if(e.key==='Enter') handleAuth(); });

// ═══ Key Binding ═══
function showKeyBinding() { $('auth-screen').style.display='none'; $('chat-screen').style.display='none'; $('key-screen').style.display='flex'; $('key-pin').value=''; $('key-error').classList.remove('show'); $('key-ok').classList.remove('show'); }
function skipKeys() { state.hasKeys = false; showChat(); }
function bindKeys() { showKeyBinding(); }

async function handleSaveKeys() {
  var apiKey = $('key-apikey').value.trim();
  var secret = $('key-secret').value.trim();
  var pp = $('key-passphrase').value.trim();
  var pin = $('key-pin').value;
  var demo = $('key-demo').checked;
  var errEl = $('key-error');
  if (!apiKey || !secret || !pp) { errEl.textContent = '请填写完整的 OKX API 信息'; errEl.classList.add('show'); return; }
  if (!pin || pin.length < 4) { errEl.textContent = '请输入 PIN 以加密存储'; errEl.classList.add('show'); return; }
  $('key-btn').disabled = true; errEl.classList.remove('show');
  try {
    var r = await fetch('/api/v2/auth/keys', { method:'PUT', headers:{'Content-Type':'application/json', Authorization:'Bearer '+state.token}, body:JSON.stringify({apiKey:apiKey,secret:secret,passphrase:pp,isDemo:demo,pin:pin}) });
    var d = await r.json();
    if (!d.ok) { errEl.textContent = d.error || '保存失败'; errEl.classList.add('show'); $('key-btn').disabled = false; return; }
    state.hasKeys = true; state.keyHint = apiKey.slice(0,4)+'****';
    $('key-ok').classList.add('show');
    setTimeout(showChat, 800);
  } catch(e) { errEl.textContent = '网络错误'; errEl.classList.add('show'); }
  $('key-btn').disabled = false;
}

// ═══ Chat ═══
async function showChat() {
  $('auth-screen').style.display='none'; $('key-screen').style.display='none'; $('chat-screen').style.display='flex';
  $('chat-name').textContent = state.username;
  $('chat-avatar').textContent = state.username[0].toUpperCase();
  if (state.hasKeys) { $('key-badge').classList.add('inline'); $('btn-bindkey').style.display = 'none'; }
  else { $('key-badge').classList.remove('inline'); $('btn-bindkey').style.display = 'flex'; }
  $('welcome-status').textContent = state.hasKeys ? 'OKX 全功能就绪' : '公开行情可用';
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  var sun = document.getElementById('theme-sun');
  if (sun) sun.innerHTML = '<use href="' + (isDark ? '#i-sun' : '#i-moon') + '"/>';

  // Auto-resume last conversation
  var savedId = localStorage.getItem('chat-conv-' + state.username);
  if (savedId) {
    try {
      var hr = await fetch('/api/v2/chat/history?conversationId=' + savedId, { headers:{Authorization:'Bearer '+state.token} });
      if (hr.ok) {
        var msgs = await hr.json();
        state.currentConvId = savedId;
        var lst = $('msg-list'), w = $('welcome');
        lst.innerHTML = ''; if (w) lst.appendChild(w);
        if (Array.isArray(msgs) && msgs.length > 0) {
          msgs.forEach(function(m){
            if (m.role === 'user') addMsg('user', m.content || '', false, true);
            else if (m.role === 'assistant') {
              var elId = addMsg('ai', m.content || '', false, true);
              if (m.tool_calls) {
                var msg = state.messages.filter(function(x){return x.elId===elId}).pop();
                if (msg) msg.toolCalls = m.tool_calls;
              }
            }
          });
        }
        $('chat-input').focus();
        return;
      }
    } catch(e) {}
  }
  try {
    var cr = await fetch('/api/v2/chat/sessions', { method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer '+state.token}, body:JSON.stringify({title:'新的对话'}) });
    if (cr.ok) { var cd = await cr.json(); state.currentConvId = cd.id; }
  } catch(e) {}
  $('chat-input').focus();
}

async function lock() {
  if (state.token) { await fetch('/api/v2/auth/lock', { method:'POST', headers:{Authorization:'Bearer '+state.token} }).catch(function(){}); }
  state.token = null; state.username = null; state.hasKeys = false;
  state.messages = []; state.streaming = false;
  if (state.username) localStorage.removeItem('chat-conv-' + state.username);
  state.currentConvId = null;
  $('msg-list').innerHTML = '<div class="welcome" id="welcome"><div class="w-logo"><span style="font-size:24px;font-weight:700;letter-spacing:-1px">H</span></div><h2>AI 交易助手</h2><p id="welcome-status">公开行情可用</p><div class="hints">'+getHintBtns()+'</div></div>';
  $('chat-screen').style.display='none'; $('auth-screen').style.display='flex'; $('auth-pin').value = '';
}

function getHintBtns() {
  var labels = ["BTC 实时价格","ETH 资金费率","市场情绪指数","RSI 技术分析","热门币种扫描","交易机会分析"];
  var qs = ["BTC 现在什么价格？","ETH 资金费率多少？","市场情绪怎么样？","BTC RSI 超买还是超卖？","最近有什么热门币？","帮我分析一下现在的交易机会"];
  var h = "";
  for (var i = 0; i < labels.length; i++) h += "<button onclick=quickAsk('" + qs[i] + "')>" + labels[i] + "</button>";
  return h;
}

function quickAsk(text) { $('chat-input').value = text; send(); }
function onInputKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }
$('chat-input').addEventListener('input', function(){ this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,120)+'px'; });

// ═══ SSE Chat ═══
async function send() {
  var text = $('chat-input').value.trim();
  if (!text || state.streaming) return;
  $('chat-input').value = ''; $('chat-input').style.height = 'auto';
  $('send-btn').disabled = true; state.streaming = true;
  $('chat-status').textContent = '';
  var welcome = $('welcome'); if (welcome) welcome.remove();
  addMsg('user', text, false);
  persistMsg({role:'user',content:text});
  var aiId = addMsg('ai', '', true);

  // Save convId for auto-resume
  if (state.currentConvId && state.username) localStorage.setItem('chat-conv-' + state.username, state.currentConvId);

  var history = state.messages.slice(-8).filter(function(m){return m.content || m.toolCalls}).map(function(m){
    var item = {role:m.role};
    var c = m.content; if (c && c.length > 800) c = c.slice(0,800) + '...';
    item.content = c || '';
    if (m.toolCalls) item.tool_calls = m.toolCalls;
    return item;
  });
  history.push({role:'user', content:text});

  var ctrl = new AbortController(); state.abortController = ctrl;
  try {
    var r = await fetch('/api/v2/chat/stream', { method:'POST', headers:{'Content-Type':'application/json',Authorization:'Bearer '+state.token}, body:JSON.stringify({messages:history}), signal:ctrl.signal });
    if (!r.ok) { var et=await r.text(); var em='HTTP '+r.status; try{em=JSON.parse(et).error||em}catch(e){} throw new Error(em); }
    var reader = r.body.getReader(); var dec = new TextDecoder(); var buf = '';
    while (true) {
      var part = await reader.read(); if (part.done) break;
      buf += dec.decode(part.value, {stream:true});
      while (buf.includes('\n\n')) {
        var idx = buf.indexOf('\n\n'); var frame = buf.slice(0,idx); buf = buf.slice(idx+2);
        var em = frame.match(/^event:\s*(.+)$/m); var dm = frame.match(/^data:\s*(.+)$/m);
        if (!em || !dm) continue;
        var type = em[1].trim(); var data;
        try { data = JSON.parse(dm[1]); } catch(e) { continue; }
        handleSSE(type, data, aiId);
      }
    }
  } catch(e) {
    if (e.name !== 'AbortError') {
      updateMsg(aiId, function(el){
        var body = el.querySelector('.body');
        if (!body.textContent || body.textContent === '...') body.innerHTML = '<span style="color:hsl(var(--destructive))">服务暂不可用</span>';
        else { var errDiv = document.createElement('div'); errDiv.style.cssText = 'color:hsl(var(--destructive));margin-top:6px;font-size:11px'; errDiv.textContent = 'Connection lost: ' + e.message; body.appendChild(errDiv); }
      });
    }
  }
  state.streaming = false; state.abortController = null;
  $('send-btn').disabled = false; $('chat-status').textContent = '';
}

function handleSSE(type, data, aiId) {
  if (type === 'text') {
    updateMsg(aiId, function(el){
      var body = el.querySelector('.body');
      body._rawText = (body._rawText || '') + (data.delta || '');
      body.innerHTML = renderMarkdown(body._rawText);
      scrollBottom();
    });
  } else if (type === 'tool_start') {
    // Track tool call for context persistence
    var msg = state.messages.filter(function(x){return x.elId===aiId}).pop();
    if (msg) {
      if (!msg._tools) msg._tools = [];
      msg._tools.push({id:data.toolId,name:data.toolName,input:data.toolInput});
    }
  } else if (type === 'tool_end') {
    // Track tool result for context
    var msg2 = state.messages.filter(function(x){return x.elId===aiId}).pop();
    if (msg2 && msg2._tools) {
      var t = msg2._tools.filter(function(tc){return tc.id===data.toolId}).pop();
      if (t) t.result = data.toolError ? {error:data.toolError} : data.toolResult;
    }
    // Show error inline
    if (data.toolError) {
      updateMsg(aiId, function(el){
        var cards = el.querySelector('.tool-cards');
        if (!cards) { cards = document.createElement('div'); cards.className = 'tool-cards'; el.querySelector('.ai-content').appendChild(cards); }
        var card = document.createElement('div'); card.className = 'tool-card error';
        card.innerHTML = '<div class="tc-header"><span class="tc-icon"><svg><use href="#i-alert"/></svg></span><span class="tc-name">' + escHtml(data.toolName) + '</span><span class="tc-time">' + (data.toolDuration||0) + 'ms</span></div><div class="tc-error">' + escHtml(data.toolError) + '</div>';
        cards.appendChild(card);
        scrollBottom();
      });
    }
  } else if (type === 'done') {
    updateMsg(aiId, function(el){
      var body = el.querySelector('.body');
      var fullText = body._rawText || data.text || '';
      body._rawText = fullText;
      body.innerHTML = renderMarkdown(fullText);
      if (data.tokens) {
        var meta = document.createElement('div');
        meta.className = 'token-meta';
        meta.innerHTML = '<span>' + (data.tokens.input || 0) + ' &uarr;</span><span>' + (data.tokens.output || 0) + ' &darr;</span>';
        body.appendChild(meta);
      }
      var m = state.messages.filter(function(x){return x.elId===aiId}).pop();
      if (m) { m.content = fullText; m.toolCalls = m._tools ? JSON.stringify(m._tools) : null; }
    });
    var m = state.messages.filter(function(x){return x.elId===aiId}).pop();
    persistMsg({role:'assistant',content:data.text||'',toolCalls:m?.toolCalls});
  } else if (type === 'error') {
    updateMsg(aiId, function(el){
      var body = el.querySelector('.body');
      if (!body.textContent) body.innerHTML = '<span style="color:hsl(var(--destructive))">' + escHtml(data.message) + '</span>';
    });
  }
}

async function persistMsg(msg) {
  if (!state.currentConvId) return;
  try { await fetch('/api/v2/chat/history/save', { method:'POST', headers:{'Content-Type':'application/json',Authorization:'Bearer '+state.token}, body:JSON.stringify({conversationId:state.currentConvId,role:msg.role,content:msg.content,toolCalls:msg.toolCalls||null}) }); } catch(e) {}
}

// ═══ History Sidebar ═══
function toggleHistory() {
  var panel = $('history-panel'), overlay = $('history-overlay');
  if (panel.classList.contains('open')) { closeHistory(); }
  else { loadConversations(); panel.classList.add('open'); overlay.style.display='block'; }
}
function closeHistory() { $('history-panel').classList.remove('open'); $('history-overlay').style.display='none'; }

async function loadConversations() {
  var list = $('history-list');
  list.innerHTML = '<div style="text-align:center;font-size:12px;color:hsl(var(--muted-foreground));padding:24px">Loading...</div>';
  try {
    var r = await fetch('/api/v2/chat/sessions', { headers:{Authorization:'Bearer '+state.token} });
    if (!r.ok || !(await r.json()).length) { list.innerHTML = '<div style="text-align:center;font-size:12px;color:hsl(var(--muted-foreground));padding:24px">No history</div>'; return; }
    var chats = await (await fetch('/api/v2/chat/sessions', { headers:{Authorization:'Bearer '+state.token} })).json();
    if (!Array.isArray(chats) || chats.length===0) { list.innerHTML='<div style="text-align:center;font-size:12px;color:hsl(var(--muted-foreground));padding:24px">No history</div>'; return; }
    list.innerHTML = chats.map(function(c){
      var t = c.title || 'Untitled';
      var time = c.created_at ? c.created_at.slice(5,16).replace('T',' ') : '';
      return '<div class="h-item'+(c.id===state.currentConvId?' active':'')+'" onclick="switchChat(\''+c.id+'\')">'+
        '<span class="h-title">'+escHtml(t)+'</span><span class="h-time">'+time+'</span>'+
        '<button class="h-del ic-trash" onclick="event.stopPropagation();deleteChat(\''+c.id+'\')" title="Delete"><svg><use href="#i-trash"/></svg></button></div>';
    }).join('');
  } catch(e) { list.innerHTML='<div style="text-align:center;font-size:12px;color:hsl(var(--muted-foreground));padding:24px">Load failed</div>'; }
}

async function switchChat(id) {
  if (id === state.currentConvId) { closeHistory(); return; }
  try {
    var r = await fetch('/api/v2/chat/history?conversationId='+id, { headers:{Authorization:'Bearer '+state.token} });
    if (r.ok) {
      var msgs = await r.json();
      state.currentConvId = id; state.messages = [];
      var lst = $('msg-list'); var w = $('welcome'); lst.innerHTML = '';
      if (w) lst.appendChild(w);
      if (Array.isArray(msgs)) { msgs.forEach(function(m){ if (m.role==='user'||m.role==='assistant') addMsg(m.role, m.content||'', false, true); }); }
    }
  } catch(e) {}
  closeHistory(); loadConversations();
}

async function newChat() {
  try {
    var r = await fetch('/api/v2/chat/sessions', { method:'POST', headers:{'Content-Type':'application/json',Authorization:'Bearer '+state.token}, body:JSON.stringify({title:'New Chat'}) });
    if (r.ok) {
      var d = await r.json(); state.currentConvId = d.id; state.messages = [];
      $('msg-list').innerHTML = '<div class="welcome" id="welcome"><div class="w-logo"><span style="font-size:24px;font-weight:700;letter-spacing:-1px">H</span></div><h2>AI 交易助手</h2><p id="welcome-status">374+ OKX tools ready</p><div class="hints">'+getHintBtns()+'</div></div>';
    }
  } catch(e) {}
  closeHistory(); loadConversations();
}

async function deleteChat(id) {
  if (!confirm('Delete this conversation?')) return;
  try { await fetch('/api/v2/chat/history?conversationId='+id, { method:'DELETE', headers:{Authorization:'Bearer '+state.token} }); if (id === state.currentConvId) newChat(); } catch(e) {}
  loadConversations();
}

// ═══ UI ═══
function addMsg(role, content, streaming, isHistory) {
  var el = document.createElement('div'); el.className = 'msg ' + role;
  if (streaming) el.classList.add('streaming');
  if (role === 'user') {
    el.innerHTML = '<div class="bubble">' + escHtml(content || '') + '</div>';
  } else {
    var rendered = renderMarkdown(content || '');
    el.innerHTML = '<div class="ai-wrapper"><div class="ai-content"><div class="sender">hvip AI</div>' +
      '<div class="body">' + (streaming ? '...' : rendered) + '</div></div></div>';
    if (!streaming && content) el.querySelector('.body')._rawText = content;
  }
  $('msg-list').appendChild(el);
  if (!streaming || isHistory) scrollBottom();
  var id = 'msg-'+Date.now()+'-'+Math.random().toString(36).slice(2,6); el.id = id;
  state.messages.push({role:role, content:content, elId:id});
  return id;
}

function updateMsg(id, fn) { var el = document.getElementById(id); if (el) fn(el); }

function scrollBottom() { $('msg-list').scrollTop = $('msg-list').scrollHeight; }
</script>
