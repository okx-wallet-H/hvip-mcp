<!doctype html>
<html lang="zh" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>hvip AI·聊天</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root,[data-theme="light"]{--bg:#f4f5f7;--surface:#fff;--elevated:#f9f9fb;--border:#e7e8ec;--text:#17171f;--text2:#4d4d5c;--muted:#8b8b9a;--accent:#6366f1;--accent-hover:#4f46e5;--success:#16a34a;--danger:#dc2626;--shadow:0 0 0 1px rgba(0,0,0,.03),0 1px 3px rgba(0,0,0,.04);--radius:12px;--radius-sm:8px}
[data-theme="dark"]{--bg:#131316;--surface:#1c1c22;--elevated:#24242b;--border:#2c2c34;--text:#eaeaef;--text2:#b0b0bc;--muted:#6b6b78}
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%}
body{font-family:Inter,system-ui,sans-serif;font-size:13.5px;line-height:1.6;color:var(--text2);background:var(--bg);height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:var(--shadow);z-index:2}
header .brand{display:flex;align-items:center;gap:8px}
header .brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff}
header h1{font-size:15px;font-weight:700;color:var(--text);letter-spacing:-.3px}
header .dot{width:7px;height:7px;border-radius:50%;background:var(--success);animation:pulse 2s infinite}
header .dot.off{background:var(--muted);animation:none}
header .actions button{background:none;border:1px solid var(--border);cursor:pointer;padding:5px 9px;border-radius:6px;color:var(--muted);font-size:13px;transition:all .15s}
header .actions button:hover{border-color:var(--accent);color:var(--accent)}
main{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:88%;padding:10px 14px;border-radius:var(--radius);line-height:1.55;font-size:13px;animation:in .2s ease;word-break:break-word}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,#6366f112,#8b5cf610);border:1px solid #6366f120;border-bottom-right-radius:4px;color:var(--text)}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px;box-shadow:var(--shadow)}
.msg .sender{font-size:10px;font-weight:600;margin-bottom:4px}
.msg.user .sender{color:var(--accent)}.msg.ai .sender{color:var(--muted)}
.msg .body{white-space:pre-wrap}
.msg .tools{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px}
.msg .tools span{font-size:9.5px;background:var(--elevated);border:1px solid var(--border);padding:2px 8px;border-radius:12px;color:var(--muted);font-weight:500}
.welcome{text-align:center;color:var(--muted);margin-top:40px}
.welcome .icon{font-size:44px;margin-bottom:14px;opacity:.8}
.welcome h2{font-size:17px;margin-bottom:6px;color:var(--text);font-weight:700}
.welcome p{font-size:12.5px;margin-bottom:4px;line-height:1.6}
.welcome .hints{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px}
.welcome .hints button{font-size:11.5px;padding:7px 15px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;transition:all .15s;font-family:inherit;box-shadow:var(--shadow)}
.welcome .hints button:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
footer{padding:10px 14px;background:var(--surface);border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end;box-shadow:0 -1px 3px rgba(0,0,0,.03);z-index:2}
footer textarea{flex:1;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;resize:none;outline:none;line-height:1.45;max-height:110px;font-family:inherit;transition:border-color .15s}
footer textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #6366f110}
footer button{padding:10px 16px;border-radius:var(--radius-sm);border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
footer button:hover{background:var(--accent-hover)}
footer button:disabled{opacity:.4;cursor:default}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>
<body>

<header><div class="brand"><div class="logo">🤖</div><h1>hvip AI</h1><span class="dot" id="dot"></span></div>
<div class="actions"><button onclick="clearChat()">🗑</button><button onclick="toggleTheme()" id="themeBtn">🌙</button></div></header>

<main id="chat">
<div class="welcome" id="welcome"><div class="icon">🤖</div><h2>AI 交易助手</h2><p>365个OKX工具就绪 · 直接提问</p>
<div class="hints">
<button onclick='quickAsk("BTC 现在什么价格？")'>₿ BTC 价格</button>
<button onclick='quickAsk("ETH 资金费率多少？")'>Ξ ETH 费率</button>
<button onclick='quickAsk("市场情绪怎么样？")'>📊 市场情绪</button>
<button onclick='quickAsk("BTC RSI多少 超买还是超卖")'>📈 RSI 分析</button>
<button onclick='quickAsk("最近有什么热门币？")'>🔥 热门币种</button>
<button onclick='quickAsk("帮我分析一下现在的交易机会")'>💡 交易机会</button>
</div></div>
</main>

<footer><textarea id="input" rows="1" placeholder="输入消息..."></textarea><button id="sendBtn" onclick="send()">发送</button></footer>

<script>
const $=id=>document.getElementById(id)
const chat=$('chat'),input=$('input'),sendBtn=$('sendBtn')
let messages=[],loading=false

function toggleTheme(){const d=document.documentElement.getAttribute('data-theme')==='dark';document.documentElement.setAttribute('data-theme',d?'light':'dark');$('themeBtn').textContent=d?'🌙':'☀️';localStorage.setItem('chat-theme',d?'light':'dark')}
;(function(){const s=localStorage.getItem('chat-theme');if(s){document.documentElement.setAttribute('data-theme',s);$('themeBtn').textContent=s==='dark'?'☀️':'🌙'}})()

async function checkHealth(){try{await fetch('/health');$('dot').className='dot'}catch{$('dot').className='dot off'}}
checkHealth();setInterval(checkHealth,30000)

function clearChat(){messages=[];chat.innerHTML='';if($('welcome'))chat.appendChild($('welcome'))}
function quickAsk(text){input.value=text;send()}

// ── OpenAI-compatible send ──
async function send(){
  const text=input.value.trim();if(!text||loading)return
  input.value='';input.style.height='auto';sendBtn.disabled=true
  const w=$('welcome');if(w)w.remove()
  addMsg('user',text);loading=true

  const oaiMsgs=[
    {role:'system',content:'你是 hvip AI，加密货币交易助手。你有OKX MCP工具可以查实时行情。规则：1)查数据必须先调工具 2)工具返回空数据就说"暂无数据"，绝不编造数字 3)回答简洁有据。'},
    ...messages,
  ]

  try{
    for(let turn=0;turn<5;turn++){
      const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({messages:oaiMsgs,tools:getToolsOAI()})})
      if(!res.ok){const e=await res.text();addMsg('ai','❌ '+res.status);loading=false;sendBtn.disabled=false;return}
      const data=await res.json()
      if(data.error){addMsg('ai','❌ '+data.error.message);loading=false;sendBtn.disabled=false;return}
      const choice=data.choices?.[0]?.message||{}

      if(choice.tool_calls&&choice.tool_calls.length){
        oaiMsgs.push({role:'assistant',content:choice.content||null,tool_calls:choice.tool_calls})
        const toolMsgs=[];const names=[]
        for(const tc of choice.tool_calls){
          names.push(tc.function.name)
          try{
            let args={};try{args=JSON.parse(tc.function.arguments||'{}')}catch{}
            const r=await callMCP(tc.function.name,args)
            toolMsgs.push({role:'tool',tool_call_id:tc.id,content:typeof r==='string'?r:JSON.stringify(r).slice(0,2000)})
          }catch(e){toolMsgs.push({role:'tool',tool_call_id:tc.id,content:'Error: '+e.message})}
        }
        oaiMsgs.push(...toolMsgs)
        addMsg('ai','🔧 '+names.join(', '))
        continue
      }

      if(choice.content){
        addMsg('ai',choice.content)
        oaiMsgs.push({role:'assistant',content:choice.content})
      }else{addMsg('ai','(无内容)')}
      loading=false;sendBtn.disabled=false;return
    }
    loading=false;sendBtn.disabled=false
  }catch(e){addMsg('ai','❌ '+e.message);loading=false;sendBtn.disabled=false}
}

// ── MCP（Hub 代理已处理 session + SSE → JSON）──
async function callMCP(name,args){
  const res=await fetch('/mcp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',method:'tools/call',params:{name,arguments:args},id:Date.now()})})
  const t=await res.text()
  try{
    const j=JSON.parse(t)
    if(j.error)throw new Error(j.error.message||'MCP error')
    let result=j.result?.content?.[0]?.text
    if(!result)result=j.result
    if(typeof result==='string'){try{result=JSON.parse(result)}catch{}}
    return result
  }catch(e){
    if(e.message.includes('MCP'))throw e
    return t
  }
}

// ── UI ──
function addMsg(role,content){messages.push({role,content});const d=document.createElement('div');d.className='msg '+role;d.innerHTML='<div class=sender>'+(role==='user'?'👤 你':role==='tool'?'🔧 工具':'🤖 hvip')+'</div><div class=body>'+esc(content)+'</div>';chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,110)+'px'})
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}})

// ── Tools (OpenAI format) ──
function getToolsOAI(){return[
{type:'function',function:{name:'sys_catalog',description:'全局工具导航——第一个应调用的工具',parameters:{type:'object',properties:{},required:[]}}},
{type:'function',function:{name:'market_quick',description:'单产品行情+深度+资金费率',parameters:{type:'object',properties:{instId:{type:'string',description:'如BTC-USDT-SWAP'}},required:['instId']}}},
{type:'function',function:{name:'indicator_calc',description:'技术指标:rsi/macd/bb/atr/stoch/ema/sma/wr/cci/obv/vwap/adx/mfi/cmf/supertrend/keltner/pattern',parameters:{type:'object',properties:{instId:{type:'string'},indicator:{type:'string',enum:['rsi','macd','bb','atr','stoch','ema','sma','wr','cci','obv','vwap','adx','mfi','cmf','supertrend','keltner','pattern']},period:{type:'number'},bar:{type:'string'}},required:['instId','indicator']}}},
{type:'function',function:{name:'scan_sentiment',description:'市场情绪仪表盘(0-100)',parameters:{type:'object',properties:{instFamily:{type:'string',description:'如BTC-USD'}},required:[]}}},
{type:'function',function:{name:'scan_market',description:'市场异动扫描：涨幅/跌幅/成交量/费率异常',parameters:{type:'object',properties:{instType:{type:'string',enum:['SPOT','SWAP','FUTURES']},topN:{type:'number'},sortBy:{type:'string',enum:['change','vol','fundingRate']}},required:[]}}},
{type:'function',function:{name:'market_ticker',description:'获取产品实时行情',parameters:{type:'object',properties:{instId:{type:'string',description:'如BTC-USDT'}},required:['instId']}}},
{type:'function',function:{name:'market_funding_rate',description:'获取资金费率',parameters:{type:'object',properties:{instId:{type:'string'}},required:['instId']}}},
{type:'function',function:{name:'account_overview',description:'账户全景：余额+持仓+配置(需OKX Key)',parameters:{type:'object',properties:{},required:[]}}},
]}
</script>
</body>
</html>
